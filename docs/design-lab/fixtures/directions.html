      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{render();remember(direction);}});tweak.addSelect(s,'screen',{label:'الشاشة',options:[{label:'التسجيل',value:'recording'},{label:'النتيجة',value:'result'}]});tweak.addSelect(s,'theme',{label:'المظهر',options:[{label:'حسب الجهاز',value:'system'},{label:'فاتح',value:'light'},{label:'داكن',value:'dark'}]});tweak.addSelect(s,'locale',{label:'لغة الواجهة',options:[{label:'العربية',value:'ar'},{label:'Français',value:'fr'}]});}
      app.llPreview={set(values){for(const [key,value] of Object.entries(values))if(valid(key,value))s[key]=value;render();}};
    });
    restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  })();
  </script>
</div>
